selectedTests:
  - id: org.springframework.samples.petclinic.owner.OwnerControllerTests#processCreationFormSuccess
    expectedTestType: spring-web-mvc-slice
    expectedApplicationMethods:
      - org.springframework.samples.petclinic.owner.OwnerController.findOwner
      - org.springframework.samples.petclinic.owner.OwnerController.setAllowedFields
      - org.springframework.samples.petclinic.owner.OwnerController.processCreationForm
    expectedEndpoint: "POST /owners/new"
    expectedRepositoryInteractions:
      - org.springframework.samples.petclinic.owner.OwnerRepository.save(Owner)
    expectedEntities: [Owner]
    mappedTables: [owners]
    expectedObservedTables: []
    validationTargetTables: []
    explicitlyForbiddenDependencies:
      endpoints: ["GET /vets", "GET /vets.html"]
      repositoryInteractions: [org.springframework.samples.petclinic.vet.VetRepository.findAll]
      observedTables: [owners, vets, vet_specialties, specialties]
    crossThreadPropagationExpected: false

  - id: org.springframework.samples.petclinic.service.ClinicServiceTests#shouldInsertOwner
    expectedTestType: spring-data-jpa-slice
    expectedApplicationMethods: []
    expectedEndpoint: null
    expectedRepositoryInteractions:
      - org.springframework.samples.petclinic.owner.OwnerRepository.findByLastNameStartingWith
      - org.springframework.samples.petclinic.owner.OwnerRepository.save(Owner)
      - org.springframework.samples.petclinic.owner.OwnerRepository.findByLastNameStartingWith
    expectedEntities: [Owner]
    mappedTables: [owners]
    expectedObservedTables: [owners]
    validationTargetTables: []
    explicitlyForbiddenDependencies:
      endpoints: ["POST /owners/new", "GET /vets", "GET /vets.html"]
      repositoryInteractions: [org.springframework.samples.petclinic.vet.VetRepository.findAll]
      observedTables: [vets, vet_specialties, specialties]
    crossThreadPropagationExpected: false

  - id: org.springframework.samples.petclinic.PetClinicIntegrationTests#findAll
    expectedTestType: spring-boot-random-port-integration
    expectedApplicationMethods: []
    expectedEndpoint: null
    expectedRepositoryInteractions:
      - org.springframework.samples.petclinic.vet.VetRepository.findAll
    expectedEntities: [Vet]
    mappedTables: [vets, vet_specialties, specialties]
    expectedObservedTables: [vets]
    validationTargetTables: [vet_specialties, specialties]
    explicitlyForbiddenDependencies:
      endpoints: ["POST /owners/new", "GET /vets", "GET /vets.html"]
      repositoryInteractions:
        - org.springframework.samples.petclinic.owner.OwnerRepository.save(Owner)
      sqlOperations: ["INSERT owners"]
    crossThreadPropagationExpected: false

