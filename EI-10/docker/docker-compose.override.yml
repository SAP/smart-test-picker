services:
  jenkins-controller:
    ports:
      - "18082:8080"
  jenkins-agent:
    volumes:
      - ${EI10_SPRING_FRAMEWORK_DIR:?Set EI10_SPRING_FRAMEWORK_DIR}:/opt/ei10/spring-framework:ro
      - ei10_map_storage:/opt/ei10/map-storage
  jenkins-agent-1:
    volumes:
      - ${EI10_SPRING_FRAMEWORK_DIR:?Set EI10_SPRING_FRAMEWORK_DIR}:/opt/ei10/spring-framework:ro
      - ei10_map_storage:/opt/ei10/map-storage
  jenkins-agent-2:
    volumes:
      - ${EI10_SPRING_FRAMEWORK_DIR:?Set EI10_SPRING_FRAMEWORK_DIR}:/opt/ei10/spring-framework:ro
      - ei10_map_storage:/opt/ei10/map-storage
  jenkins-agent-3:
    volumes:
      - ${EI10_SPRING_FRAMEWORK_DIR:?Set EI10_SPRING_FRAMEWORK_DIR}:/opt/ei10/spring-framework:ro
      - ei10_map_storage:/opt/ei10/map-storage

volumes:
  ei10_map_storage:
    name: ei10_map_storage
