import org.gradle.testing.jacoco.plugins.JacocoTaskExtension

plugins {
    id 'java'
}

description = 'Disposable Spring Data end-to-end runtime fixture'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

configurations {
    e2eJacocoAgent
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.1.0')
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    runtimeOnly 'com.h2database:h2'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation project(':stp-spring-data-adapter')
    testRuntimeOnly project(':stp-junit-adapter')
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    e2eJacocoAgent 'org.jacoco:org.jacoco.agent:0.8.15:runtime@jar'
}

def agentJar = project(':stp-agent').tasks.named('shadowJar').flatMap { it.archiveFile }
def outputDir = layout.buildDirectory.dir('e2e')

def configureFixtureTest = { Test task, String runName, boolean adapterEnabled, String order ->
    task.useJUnitPlatform()
    task.extensions.configure(JacocoTaskExtension) { JacocoTaskExtension extension -> extension.enabled = false }
    task.dependsOn project(':stp-agent').tasks.named('agentJar'), project(':stp-spring-data-adapter').tasks.named('jar')
    task.outputs.file(outputDir.map { it.file("${runName}.json") })
    task.doFirst {
        outputDir.get().asFile.mkdirs()
        def stp = "-javaagent:${agentJar.get().asFile}=output=${outputDir.get().file("${runName}.json").asFile};includes=example.springdatae2e.app.;runId=e2e-run;instrumentation=on"
        if (order == 'jacoco-first') {
            def jacoco = "-javaagent:${configurations.e2eJacocoAgent.singleFile}=destfile=${outputDir.get().file("${runName}-jacoco.exec").asFile}"
            task.jvmArgs jacoco, stp
        } else if (order == 'stp-first') {
            def jacoco = "-javaagent:${configurations.e2eJacocoAgent.singleFile}=destfile=${outputDir.get().file("${runName}-jacoco.exec").asFile}"
            task.jvmArgs stp, jacoco
        } else task.jvmArgs stp
        task.systemProperty 'stp.spring-data.enabled', Boolean.toString(adapterEnabled)
        task.systemProperty 'e2e.run.name', runName
        task.systemProperty 'e2e.metrics.output', outputDir.get().file("${runName}-adapter-metrics.json").asFile.absolutePath
    }
}

configureFixtureTest(tasks.named('test').get(), 'stp-only', true, 'stp-only')

tasks.register('adapterDisabledTest', Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    configureFixtureTest(delegate, 'adapter-disabled', false, 'stp-only')
}

tasks.register('stpRepeatTest', Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    configureFixtureTest(delegate, 'stp-repeat', true, 'stp-only')
}

tasks.register('jacocoBeforeStpTest', Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    configureFixtureTest(delegate, 'jacoco-before-stp', true, 'jacoco-first')
}

tasks.register('stpBeforeJacocoTest', Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    configureFixtureTest(delegate, 'stp-before-jacoco', true, 'stp-first')
}

tasks.register('e2eFixture') {
    group = 'verification'
    dependsOn tasks.named('test'), tasks.named('stpRepeatTest'), tasks.named('adapterDisabledTest'),
            tasks.named('jacocoBeforeStpTest'), tasks.named('stpBeforeJacocoTest')
}

tasks.register('validateE2eFixture', Exec) {
    dependsOn tasks.named('e2eFixture')
    commandLine 'ruby', layout.projectDirectory.file('validate_e2e.rb').asFile.absolutePath,
            outputDir.get().asFile.absolutePath,
            layout.projectDirectory.file('golden/normalized-runtime.json').asFile.absolutePath
}

tasks.register('copyAcceptanceJacocoAgent', Copy) {
    from configurations.e2eJacocoAgent
    into layout.buildDirectory.dir('acceptance-dependencies')
    rename { 'jacocoagent.jar' }
}

// Disposable spike only: intentionally no publishing configuration.
