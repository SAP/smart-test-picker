plugins {
    id 'java-gradle-plugin'
    id 'maven-publish'
}

group = 'com.sap.oss.smart-test-picker'
version = '0.1.0'

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    implementation project(':smart-test-picker-common')
    implementation project(':smart-test-picker-core')
    implementation 'com.google.code.gson:gson:2.10.1'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.3'
    testImplementation gradleTestKit()
}

test {
    useJUnitPlatform()
    dependsOn ':stp-agent:shadowJar', ':smart-test-picker-core:jar',
            ':smart-test-picker-common:publishMavenJavaPublicationToFunctionalTestRepository',
            ':smart-test-picker-core:publishMavenJavaPublicationToFunctionalTestRepository',
            ':stp-agent:publishAgentPublicationToFunctionalTestRepository',
            ':smart-test-picker:publishPluginMavenPublicationToFunctionalTestRepository',
            ':smart-test-picker:publishSmartTestPickerPluginMarkerMavenPublicationToFunctionalTestRepository'
    systemProperty 'stp.test.agent.jar', project(':stp-agent').layout.buildDirectory.file('libs/stp-agent.jar').get().asFile
    systemProperty 'stp.test.core.jar', project(':smart-test-picker-core').layout.buildDirectory.file('libs/smart-test-picker-core-0.1.0.jar').get().asFile
    systemProperty 'stp.test.source.root', rootProject.projectDir
    systemProperty 'stp.test.maven.repository', rootProject.layout.buildDirectory.dir('functional-test-maven-repository').get().asFile
}

gradlePlugin {
    plugins {
        smartTestPicker {
            id = 'com.sap.oss.smart-test-picker'
            implementationClass = 'com.sap.oss.smarttestpicker.SmartTestPickerPlugin'
        }
    }
}

tasks.named('jar') {
    manifest { attributes('Implementation-Version': project.version) }
}

def generatedVersionResources = layout.buildDirectory.dir('generated-resources/plugin-version')
tasks.register('writePluginVersion') {
    outputs.file(generatedVersionResources.map { it.file('META-INF/smart-test-picker/plugin-version.txt') })
    doLast {
        def output = generatedVersionResources.get().file('META-INF/smart-test-picker/plugin-version.txt').asFile
        output.parentFile.mkdirs()
        output.text = project.version.toString() + '\n'
    }
}
sourceSets.main.output.dir(generatedVersionResources, builtBy: tasks.named('writePluginVersion'))

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        mavenLocal()
    }
}
