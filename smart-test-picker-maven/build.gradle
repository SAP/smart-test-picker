plugins {
    id 'java'
    id 'maven-publish'
    id 'org.gradlex.maven-plugin-development' version '1.0.3'
}

group = 'com.sap.oss.smart-test-picker'
version = '0.1.0'

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    implementation project(':smart-test-picker-common')
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.junit.platform:junit-platform-launcher:1.9.3'
    runtimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.3'
    runtimeOnly 'org.junit.jupiter:junit-jupiter-params:5.9.3'

    compileOnly 'org.apache.maven:maven-plugin-api:3.9.6'
    compileOnly 'org.apache.maven.plugin-tools:maven-plugin-annotations:3.11.0'
    compileOnly 'org.apache.maven:maven-core:3.9.6'
    implementation 'org.apache.maven.shared:maven-invoker:3.3.0'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.3'
    testImplementation 'org.apache.maven:maven-plugin-api:3.9.6'
    testImplementation 'org.apache.maven.plugin-tools:maven-plugin-annotations:3.11.0'
}

test {
    useJUnitPlatform()
    dependsOn ':smart-test-picker-common:publishAllPublicationsToFunctionalTestRepository'
    dependsOn 'publishAllPublicationsToFunctionalTestRepository'
    systemProperty 'smartTestPicker.functionalTestRepository',
            rootProject.layout.buildDirectory.dir('functional-test-maven-repository').get().asFile
}

// Keep published bytecode compatible with the project's Java 17 baseline.
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

mavenPlugin {
    helpMojoPackage = 'com.sap.oss.smarttestpicker.maven'
}

publishing {
    publications {
        mavenPlugin(MavenPublication) {
            from components.java
        }
    }
    repositories {
        mavenLocal()
    }
}
