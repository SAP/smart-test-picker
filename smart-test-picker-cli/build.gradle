plugins {
    id 'java'
    id 'application'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '8.3.6'
}

dependencies {
    implementation project(':smart-test-picker-common')
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'info.picocli:picocli:4.7.6'
    annotationProcessor 'info.picocli:picocli-codegen:4.7.6'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.3'
}

test {
    useJUnitPlatform()
}

application {
    mainClass = 'com.sap.oss.smarttestpicker.cli.SmartTestPickerCli'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

shadowJar {
    archiveClassifier = 'all'
    mergeServiceFiles()
}

tasks.withType(Jar).configureEach {
    manifest { attributes('Implementation-Version': project.version) }
}

publishing {
    publications {
        cli(MavenPublication) {
            artifact(tasks.named('shadowJar')) { classifier = null }
            artifact tasks.named('sourcesJar')
            artifact tasks.named('javadocJar')
            artifactId = 'smart-test-picker-cli'
            pom.packaging = 'jar'
        }
    }
}
