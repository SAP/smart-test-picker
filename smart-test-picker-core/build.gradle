plugins {
    id 'java'
    id 'maven-publish'
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly 'org.junit.platform:junit-platform-launcher:1.9.3'
    compileOnly 'org.junit.platform:junit-platform-engine:1.9.3'
    compileOnly 'org.junit.jupiter:junit-jupiter-api:5.9.3'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.3'
    testImplementation 'org.junit.platform:junit-platform-launcher:1.9.3'
    testImplementation 'org.junit.platform:junit-platform-engine:1.9.3'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.tngtech.archunit:archunit-junit4:1.5.0'
    testRuntimeOnly 'org.junit.vintage:junit-vintage-engine:5.9.3'
}

test {
    useJUnitPlatform()
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        mavenLocal()
    }
}
