plugins {
    id 'java-library'
    id 'com.gradleup.shadow' version '8.3.6'
}

description = 'Isolated STP remote servlet request correlation agent POC'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

sourceSets {
    petclinicRemoteTest {
        java.srcDir 'src/petclinicRemoteTest/java'
    }
}

configurations {
    otelJavaAgent
}

dependencies {
    implementation 'org.ow2.asm:asm:9.8'
    implementation 'org.ow2.asm:asm-tree:9.8'
    implementation 'org.ow2.asm:asm-commons:9.8'
    implementation 'io.opentelemetry:opentelemetry-api:1.66.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.3'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.9.3'
    testImplementation 'io.opentelemetry:opentelemetry-api:1.66.0'
    testImplementation 'io.opentelemetry:opentelemetry-sdk:1.66.0'
    otelJavaAgent 'io.opentelemetry.javaagent:opentelemetry-javaagent:2.32.0'
    testImplementation 'org.eclipse.jetty:jetty-server:11.0.25'
    testImplementation 'org.eclipse.jetty:jetty-servlet:11.0.25'
    testImplementation 'org.springframework:spring-webmvc:6.1.14'
    testImplementation 'jakarta.servlet:jakarta.servlet-api:5.0.0'
    testImplementation 'javax.servlet:javax.servlet-api:4.0.1'
    testImplementation 'org.ow2.asm:asm-util:9.8'

    petclinicRemoteTestImplementation project(':stp-runtime')
    petclinicRemoteTestImplementation 'org.junit.jupiter:junit-jupiter:5.9.3'
    petclinicRemoteTestImplementation 'org.junit.jupiter:junit-jupiter-params:5.9.3'
    petclinicRemoteTestRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.3'
    petclinicRemoteTestImplementation 'io.opentelemetry:opentelemetry-api:1.66.0'
}

tasks.named('shadowJar') {
    archiveFileName = 'stp-remote-agent.jar'
    archiveClassifier = ''
    relocate 'org.objectweb.asm', 'com.sap.oss.smarttestpicker.remote.internal.asm'
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'META-INF/gradle/**'
    manifest {
        attributes(
                'Premain-Class': 'com.sap.oss.smarttestpicker.remote.RemoteStpAgent',
                'Implementation-Version': project.version,
                'Can-Redefine-Classes': 'false',
                'Can-Retransform-Classes': 'false'
        )
    }
}

tasks.register('remoteAgentJar') {
    group = 'build'
    description = 'Builds the standalone STP remote servlet request correlation agent.'
    dependsOn tasks.named('shadowJar')
}

tasks.register('copyOpenTelemetryJavaAgent', Copy) {
    from configurations.otelJavaAgent
    into layout.buildDirectory.dir('otel-agent')
    rename { 'opentelemetry-javaagent.jar' }
}

def petclinicClientAgentJar = project(':stp-agent').layout.buildDirectory.file('libs/stp-agent.jar')
tasks.register('petclinicRemoteTest', Test) {
    description = 'Runs isolated PetClinic REST identity-propagation validation tests.'
    group = 'verification'
    // The attached STP agent writes a sidecar JSON file outside Gradle's declared test outputs.
    outputs.cacheIf('STP agent sidecar output is not managed by the Test task') { false }
    testClassesDirs = sourceSets.petclinicRemoteTest.output.classesDirs
    classpath = sourceSets.petclinicRemoteTest.runtimeClasspath
    useJUnitPlatform()
    dependsOn project(':stp-agent').tasks.named('agentJar')
    extensions.configure(org.gradle.testing.jacoco.plugins.JacocoTaskExtension) { jacocoExtension ->
        jacocoExtension.enabled = false
    }

    def clientOutput = providers.gradleProperty('petclinicClientOutput')
            .orElse(layout.buildDirectory.file('petclinic-poc/client-stp.json').map { it.asFile.absolutePath })
    def runId = providers.gradleProperty('petclinicRunId').orElse('petclinic-remote')
    doFirst {
        def baseUrl = providers.gradleProperty('petclinicBaseUrl').orNull
        if (baseUrl == null || baseUrl.isBlank()) {
            throw new GradleException('Supply -PpetclinicBaseUrl=http://127.0.0.1:<port>')
        }
        systemProperty 'petclinic.baseUrl', baseUrl
        def output = file(clientOutput.get())
        output.parentFile.mkdirs()
        delete output
        def agentArguments = "output=${output};runId=${runId.get()};instrumentation=off;debug=false"
        println "PetClinic client STP agent: ${petclinicClientAgentJar.get().asFile}=${agentArguments}"
        jvmArgs "-javaagent:${petclinicClientAgentJar.get().asFile}=${agentArguments}"
    }
    testLogging {
        showStandardStreams = true
        events 'started', 'passed', 'failed', 'skipped'
    }
    if (providers.gradleProperty('petclinicParallel').orNull == 'true') {
        systemProperty 'junit.jupiter.execution.parallel.enabled', 'true'
        systemProperty 'junit.jupiter.execution.parallel.mode.default', 'concurrent'
    }
}

tasks.test {
    useJUnitPlatform()
    sourceSets.test.java.srcDir 'petclinic-poc'
    dependsOn tasks.named('remoteAgentJar'), tasks.named('copyOpenTelemetryJavaAgent')
    doFirst {
        systemProperty 'stp.remote.agent.jar', tasks.named('shadowJar').get().archiveFile.get().asFile.absolutePath
        systemProperty 'stp.otel.agent.jar', layout.buildDirectory.file('otel-agent/opentelemetry-javaagent.jar').get().asFile.absolutePath
    }
}
