plugins {
    id 'java-library'
}

description = 'Karate 1.x client integration for STP request identity in W3C Baggage'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach { options.release = 17 }

dependencies {
    // The test project supplies Karate; adding STP must not upgrade its runner.
    compileOnlyApi 'io.karatelabs:karate-core:1.5.1'
    api 'io.opentelemetry:opentelemetry-api:1.66.0'
    testImplementation 'io.karatelabs:karate-core:1.5.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.3'
}

tasks.test {
    useJUnitPlatform()
}
