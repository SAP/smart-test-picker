plugins {
    id 'java'
}

description = 'Unpublished PetClinic acceptance and lifecycle diagnostic fixture'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

sourceSets {
    confirmation {
        runtimeClasspath += output + compileClasspath
    }
}

dependencies {
	confirmationCompileOnly 'org.springframework:spring-aop:7.0.8'
	confirmationCompileOnly 'org.springframework:spring-beans:7.0.8'
	confirmationCompileOnly 'org.springframework:spring-context:7.0.8'
	confirmationCompileOnly 'org.springframework:spring-context-support:7.0.8'
	confirmationCompileOnly 'org.springframework:spring-test:7.0.8'
	confirmationCompileOnly 'org.springframework:spring-tx:7.0.8'
	confirmationCompileOnly 'org.springframework.data:spring-data-commons:4.1.0'
}

tasks.register('petclinicConfirmationJar', Jar) {
    dependsOn tasks.named('confirmationClasses')
    archiveFileName = 'spring-data-petclinic-confirmation.jar'
    from sourceSets.confirmation.output
}

// Reproduction fixture only: intentionally no publishing plugin or production dependency.
