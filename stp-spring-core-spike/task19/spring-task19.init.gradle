import org.gradle.jvm.toolchain.JavaLanguageVersion

gradle.afterProject { project, state ->
    if (project.path != ':spring-core') return
    project.tasks.named('test').configure {
        def required = ['TASK19_RUN_DIR', 'TASK19_ASM_AGENT', 'TASK19_JACOCO_AGENT',
                        'TASK19_ORACLE_AGENT', 'TASK19_LIFECYCLE_JAR', 'TASK19_JACOCO_LISTENER_JAR',
                        'TASK19_TEST_SELECTOR']
        def values = required.collectEntries { key -> [(key): System.getenv(key)] }
        def missing = values.findAll { key, value -> !value }.keySet()
        if (!missing.isEmpty()) throw new GradleException("Missing TASK 19 environment: ${missing}")
        def runDir = file(values.TASK19_RUN_DIR)
        runDir.mkdirs()
        def oracleEnabled = (System.getenv('TASK19_ORACLE_ENABLED') ?: 'true').toBoolean()
        classpath += oracleEnabled ? project.files(values.TASK19_LIFECYCLE_JAR, values.TASK19_JACOCO_LISTENER_JAR)
                : project.files(values.TASK19_JACOCO_LISTENER_JAR)
        maxParallelForks = 1
        forkEvery = 1
        outputs.upToDateWhen { false }
        javaLauncher = project.javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(21)
        }
        filter { includeTestsMatching(values.TASK19_TEST_SELECTOR) }
        systemProperty 'stp.exec.dir', new File(runDir, 'jacoco').absolutePath
        if (oracleEnabled) {
            systemProperty 'task19.lifecycle.output', new File(runDir, 'oracle-lifecycle.jsonl').absolutePath
            systemProperty 'junit.jupiter.extensions.autodetection.enabled', 'true'
        }
        def jacoco = "-javaagent:${values.TASK19_JACOCO_AGENT}=destfile=${new File(runDir, 'jacoco/test.exec').absolutePath},append=false,output=file,includes=org.springframework.*,classdumpdir=${new File(runDir, 'jacoco/classes').absolutePath}"
        def asmArgs = "output=${new File(runDir, 'asm-map.json').absolutePath};includes=org.springframework.;excludes=org.springframework.jcl.,org.springframework.core.testfixture.,org.springframework.javapoet.,org.springframework.objenesis.;runId=task19;debug=true;instrumentation=on"
        def asm = "-javaagent:${values.TASK19_ASM_AGENT}=${asmArgs}"
        def oracle = "-agentpath:${values.TASK19_ORACLE_AGENT}=output=${new File(runDir, 'oracle-method-events.jsonl').absolutePath},include=Lorg/springframework/"
        def order = System.getenv('TASK19_AGENT_ORDER') ?: 'jacoco-asm'
        if (order == 'jacoco-asm') jvmArgs(*(oracleEnabled ? [jacoco, asm, oracle] : [jacoco, asm]))
        else if (order == 'asm-jacoco') jvmArgs(*(oracleEnabled ? [asm, jacoco, oracle] : [asm, jacoco]))
        else throw new GradleException("Unsupported TASK19_AGENT_ORDER: ${order}")
        testLogging.showStandardStreams = true
    }
}
