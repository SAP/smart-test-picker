gradle.afterProject { project, state ->
	if (project.path == ':spring-core') {
		project.tasks.named('test').configure {
			def agentJar = System.getenv('ROUND10_AGENT_JAR')
			def agentArgs = System.getenv('ROUND10_AGENT_ARGS')
			if (!agentJar || !agentArgs) throw new GradleException('ROUND10_AGENT_JAR and ROUND10_AGENT_ARGS are required')
			jvmArgs "-javaagent:${agentJar}=${agentArgs}"
			['output', 'methods', 'tests', 'limit'].each { key ->
				def value = System.getenv("ROUND10_TRACE_${key.toUpperCase()}")
				if (value) jvmArgs "-Dstp.round10.trace.${key}=${value}"
			}
			testLogging.showStandardStreams = true
			def filterFile = System.getenv('ROUND10_FILTER_FILE')
			if (filterFile) {
				file(filterFile).readLines().findAll { !it.isBlank() }.each { selected ->
					filter.includeTestsMatching(selected)
				}
			}
			def orderSeed = System.getenv('ROUND10_ORDER_SEED')
			if (orderSeed) {
				systemProperty 'junit.jupiter.testclass.order.default', 'org.junit.jupiter.api.ClassOrderer$Random'
				systemProperty 'junit.jupiter.testmethod.order.default', 'org.junit.jupiter.api.MethodOrderer$Random'
				systemProperty 'junit.jupiter.execution.order.random.seed', orderSeed
			}
		}
	}
}
