gradle.afterProject { project, state ->
	if (project.path == ':spring-core') {
		project.tasks.named('test').configure {
			def javaExecutable = System.getenv('ROUND13_JAVA_EXECUTABLE')
			if (javaExecutable) executable = javaExecutable
			def agentJar = System.getenv('ROUND13_AGENT_JAR')
			def agentArgs = System.getenv('ROUND13_AGENT_ARGS')
			if (!agentJar || !agentArgs) throw new GradleException('ROUND13_AGENT_JAR and ROUND13_AGENT_ARGS are required')
			jvmArgs "-javaagent:${agentJar}=${agentArgs}"
			def trace = System.getenv('ROUND13_TRACE_OUTPUT')
			if (trace) systemProperty 'stp.round13.trace.output', trace
			def limit = System.getenv('ROUND13_TRACE_LIMIT')
			if (limit) systemProperty 'stp.round13.trace.limit', limit
			def filterFile = System.getenv('ROUND13_FILTER_FILE')
			if (filterFile) file(filterFile).readLines().findAll { !it.isBlank() }.each { filter.includeTestsMatching(it) }
			testLogging.showStandardStreams = true
		}
	}
}
