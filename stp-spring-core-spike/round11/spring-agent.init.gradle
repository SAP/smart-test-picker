gradle.afterProject { project, state ->
	if (project.path == ':spring-core') {
		project.tasks.named('test').configure {
			def agentJar = System.getenv('ROUND11_AGENT_JAR')
			def agentArgs = System.getenv('ROUND11_AGENT_ARGS')
			if (!agentJar || !agentArgs) throw new GradleException('ROUND11_AGENT_JAR and ROUND11_AGENT_ARGS are required')
			jvmArgs "-javaagent:${agentJar}=${agentArgs}"
			def stateOutput = System.getenv('ROUND11_STATE_OUTPUT')
			if (stateOutput) systemProperty 'stp.round11.state.output', stateOutput
			def resetBefore = System.getenv('ROUND11_RESET_BEFORE')
			if (resetBefore) systemProperty 'stp.round11.state.resetBefore', resetBefore
			def forceGcBefore = System.getenv('ROUND11_FORCE_GC_BEFORE')
			if (forceGcBefore) systemProperty 'stp.round11.state.forceGcBefore', forceGcBefore
			def classOrder = System.getenv('ROUND11_CLASS_ORDER')
			if (classOrder) {
				systemProperty 'stp.round11.classOrder', classOrder
				systemProperty 'junit.jupiter.testclass.order.default', 'com.sap.oss.smarttestpicker.junit.Round11ClassOrderer'
			}
			['output', 'methods', 'tests', 'limit'].each { key ->
				def value = System.getenv("ROUND11_TRACE_${key.toUpperCase()}")
				if (value) jvmArgs "-Dstp.round10.trace.${key}=${value}"
			}
			def filterFile = System.getenv('ROUND11_FILTER_FILE')
			if (filterFile) {
				file(filterFile).readLines().findAll { !it.isBlank() }.each { selected ->
					filter.includeTestsMatching(selected)
				}
			}
			testLogging.showStandardStreams = true
		}
	}
}
