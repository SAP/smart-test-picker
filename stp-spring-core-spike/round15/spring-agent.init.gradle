gradle.afterProject { project, state ->
	if (project.path == ':spring-core') {
		project.tasks.named('test').configure {
			def javaExecutable = System.getenv('ROUND15_JAVA_EXECUTABLE')
			if (javaExecutable) executable = javaExecutable
			def agentJar = System.getenv('ROUND15_AGENT_JAR')
			def agentArgs = System.getenv('ROUND15_AGENT_ARGS')
			if (!agentJar || !agentArgs) throw new GradleException('ROUND15_AGENT_JAR and ROUND15_AGENT_ARGS are required')
			jvmArgs "-javaagent:${agentJar}=${agentArgs}"
			def trace = System.getenv('ROUND15_TRACE_OUTPUT')
			if (trace) systemProperty 'stp.round15.trace.output', trace
			def limit = System.getenv('ROUND15_TRACE_LIMIT')
			if (limit) systemProperty 'stp.round15.trace.limit', limit
			filter.includeTestsMatching('org.springframework.core.BridgeMethodResolverTests.withGenericParameter')
			testLogging.showStandardStreams = true
		}
	}
}
