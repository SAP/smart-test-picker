gradle.afterProject { project, state ->
	if (project.path == ':spring-core') {
		project.tasks.named('test').configure {
		def agentJar = System.getenv('ROUND9_AGENT_JAR')
		def agentArgs = System.getenv('ROUND9_AGENT_ARGS')
		if (!agentJar || !agentArgs) {
			throw new GradleException('ROUND9_AGENT_JAR and ROUND9_AGENT_ARGS are required')
		}
		jvmArgs "-javaagent:${agentJar}=${agentArgs}"
		testLogging.showStandardStreams = true
		}
	}
}
